# Compose para Dokploy (Provider: Git, Compose Path: ./docker-compose.dokploy.yml).
# Diferencias con docker-compose.yml: sin `ports` (Traefik enruta por el dominio configurado en la
# pestaña Domains) y variables inyectadas explícitamente (Dokploy las escribe en .env, pero no las
# pasa solas a los contenedores). Ver docs/DESPLIEGUE.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?definir POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?definir POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?definir SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?definir ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?definir CSRF_TRUSTED_ORIGINS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?definir PUBLIC_BASE_URL}
      IP_CLIENTE_HEADER: ${IP_CLIENTE_HEADER:-}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - media:/app/media
    networks:
      - default           # para llegar a `db`
      - dokploy-network   # para que Traefik alcance al backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:

networks:
  dokploy-network:
    external: true
